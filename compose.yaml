services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  weather-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: ${WEATHER_DB_USER:-weather}
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD:-weather-local-only}
    ports:
      - "5433:5432"
    volumes:
      - weather-db-data:/var/lib/postgresql/data

  activity-ranking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activity_ranking
      POSTGRES_USER: ${ACTIVITY_RANKING_DB_USER:-activity_ranking}
      POSTGRES_PASSWORD: ${ACTIVITY_RANKING_DB_PASSWORD:-ranking-local-only}
    ports:
      - "5434:5432"
    volumes:
      - activity-ranking-db-data:/var/lib/postgresql/data

volumes:
  nats-data:
  weather-db-data:
  activity-ranking-db-data:
