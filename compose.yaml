services:
  nats:
    image: nats:2.10-alpine
    command: ['-js', '-m', '8222', '-sd', '/data']
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats-data:/data

  weather-db:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${WEATHER_DB_USER:-weather}
      MONGO_INITDB_ROOT_PASSWORD: ${WEATHER_DB_PASSWORD:-weather-local-only}
    ports:
      - '27017:27017'
    volumes:
      - weather-mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  activity-ranking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activity_ranking
      POSTGRES_USER: ${ACTIVITY_RANKING_DB_USER:-activity_ranking}
      POSTGRES_PASSWORD: ${ACTIVITY_RANKING_DB_PASSWORD:-ranking-local-only}
    ports:
      - '5434:5432'
    volumes:
      - activity-ranking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nats-data:
  weather-mongo-data:
  activity-ranking-db-data:
